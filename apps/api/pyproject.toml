[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liss-iv-reconstruction-api"
version = "0.1.0"
description = "Geospatial inference API for LISS-IV cloud removal and reconstruction"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "numpy>=1.26,<3.0",
  "pillow>=11.0,<13.0",
  "pydantic-settings>=2.8,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "rasterio>=1.4,<2.0",
  "scikit-image>=0.25,<1.0",
  "scipy>=1.15,<2.0",
  "uvicorn[standard]>=0.35,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0"
]
ml = [
  "torch>=2.7,<3.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
